name: Deploy HRMS to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          # Give the VPS enough time for npm install/build
          command_timeout: 20m

          script: |
            set -e

            echo "========================================"
            echo "Starting HRMS deployment"
            echo "========================================"

            cd /opt/HRMS-App

            echo "Creating database backup..."

            mkdir -p server/data_backups

            if [ -f server/data/hrms.db ]; then
              cp server/data/hrms.db \
                "server/data_backups/hrms-$(date +%Y%m%d-%H%M%S).db"
              echo "Database backup created."
            else
              echo "No database found. Skipping backup."
            fi

            echo "Updating repository..."

            git fetch origin main

            git checkout main

            git reset --hard origin/main

            echo "Repository updated to:"
            git log -1 --oneline

            echo "========================================"
            echo "Installing server dependencies"
            echo "========================================"

            cd /opt/HRMS-App/server

            npm ci

            echo "Rebuilding better-sqlite3..."

            npm rebuild better-sqlite3

            echo "Server dependencies ready."

            echo "========================================"
            echo "Installing client dependencies"
            echo "========================================"

            cd /opt/HRMS-App/client

            npm ci

            echo "Building React application..."

            npm run build

            echo "Client build completed."

            echo "========================================"
            echo "Restarting HRMS"
            echo "========================================"

            pm2 reload hrms || pm2 restart hrms

            pm2 save

            echo "Waiting for application..."

            sleep 5

            echo "========================================"
            echo "Health check"
            echo "========================================"

            curl -f http://127.0.0.1:4000/api/health

            echo ""

            echo "========================================"
            echo "Deployment completed successfully."
            echo "========================================"
