
name: Deploy HRMS to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            cd /opt/HRMS-App

            mkdir -p server/data_backups

            if [ -f server/data/hrms.db ]; then
              cp server/data/hrms.db server/data_backups/hrms-$(date +%Y%m%d-%H%M%S).db
            fi

            git fetch origin
            git checkout main
            git reset --hard origin/main

            cd server
            npm ci
            npm rebuild better-sqlite3

            cd ../client
            npm ci
            npm run build

            pm2 reload hrms || pm2 restart hrms
            pm2 save

            echo "Deployment completed successfully."